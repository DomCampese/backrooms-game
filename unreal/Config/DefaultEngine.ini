[/Script/EngineSettings.GameMapsSettings]
; The world is generated at run time, so any empty map will do: the engine's own.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/Backrooms.BackroomsGameMode

[/Script/Engine.RendererSettings]
; Start conservative on the Mac: no hardware ray tracing until the target
; machine's Metal support is recorded (docs/unreal-handoff.md, "Before any code").
r.RayTracing=False
; Every surface is unlit and lit by the Web build's world shader, so none of
; Unreal's lighting, eye adaptation or grading runs (UBackroomsRender's post
; volume pins the same per run).
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.LensFlare=False
; FXAA, not temporal: the Web build has no history, and its flickering tubes
; and film grain smear under TSR.
r.AntiAliasingMethod=1

[/Script/Engine.Engine]
; The revolver is held 15.5 cm in front of the eye, and its hammer and grip
; come nearer than that; the default near plane is 10 cm.
NearClipPlane=1.0
